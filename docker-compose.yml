# Fully local dev environment: no cloud Firebase project, no Java/firebase-tools on the host.
#   docker compose up --build     -> app http://localhost:5173, emulator UI http://localhost:4000
#   docker compose down           -> emulator data is exported to ./.emulator-data
# The browser talks to the emulators directly, so their ports are published on 127.0.0.1.
name: heat-is-on

services:
  firebase:
    build:
      context: .
      dockerfile: docker/firebase.Dockerfile
    command:
      - firebase
      - emulators:start
      - --project=demo-heat-is-on
      - --import=.emulator-data
      - --export-on-exit=.emulator-data
    volumes:
      - .:/app
      - ./docker/firebase.json:/app/firebase.json:ro # 0.0.0.0 hosts for inside the container
    ports:
      - "127.0.0.1:4000:4000" # Emulator UI
      - "127.0.0.1:4400:4400" # Emulator hub
      - "127.0.0.1:4500:4500" # Logging
      - "127.0.0.1:8080:8080" # Firestore
      - "127.0.0.1:9099:9099" # Auth
      - "127.0.0.1:9150:9150" # Firestore UI websocket
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/emulators').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    volumes:
      - .:/app
      - /app/node_modules # keep the image's deps; rebuild with `up --build -V` after package changes
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      firebase:
        condition: service_healthy
